no_steer_circle_drift_test:
  ros__parameters:
    # Topics used by the namespaced tianbot_core DYN launch.
    imu_topic: /tianbot/imu
    odom_topic: /tianbot/odom
    wheel_torque_command_topic: /tianbot/wheel_mit_cmd
    diagnostics_topic: /drift_test/diagnostics
    mode_status_topic: /tianbot/motion_mode_status

    # Refuse to start unless every motor is online in PC_MIT/mit mode.
    require_mit_mode: true

    # Controller order: FL, FR, RL, RR. DYN MIT already normalizes motor directions.
    motor_torque_signs: [1.0, 1.0, 1.0, 1.0]

    # Conservative commissioning profile for the first ground tests.
    control_rate_hz: 100.0
    direction: 1
    target_radius_m: 1.00
    target_speed_mps: 0.40
    hold_laps: 0.25

    accel_min_time_s: 0.35
    accel_timeout_s: 1.20
    accel_torque_nm: 0.025
    accel_exit_speed_ratio: 0.90
    initiate_duration_s: 0.30
    initiate_base_torque_nm: 0.025
    initiate_diff_torque_nm: 0.010

    hold_base_torque_nm: 0.015
    yaw_rate_kp_nm_per_radps: 0.008
    yaw_rate_ki_nm_per_rad: 0.002
    yaw_integral_limit_rad: 1.5
    max_yaw_diff_torque_nm: 0.010

    use_odom_speed_feedback: true
    speed_kp_nm_per_mps: 0.008
    max_speed_correction_nm: 0.008

    use_odom_radius_feedback: false
    radius_to_yaw_gain_radps_per_m: 0.35
    radial_velocity_to_yaw_gain_rad_per_m: 0.08
    radius_feedback_delay_s: 3.8
    max_radius_yaw_bias_radps: 0.20
    radius_filter_tau_s: 0.25

    max_wheel_torque_nm: 0.040
    max_torque_slew_nmps: 0.15
    stop_duration_s: 0.60
    sensor_timeout_s: 0.20
    max_abs_yaw_rate_radps: 1.2
    max_speed_mps: 0.8
    gyro_bias_min_samples: 80
    log_directory: ~/.ros/drift_test_logs
