no_steer_circle_drift_test:
  ros__parameters:
    # Topics used by the namespaced tianbot_core DYN launch.
    imu_topic: /tianbot/imu
    odom_topic: /tianbot/odom
    wheel_torque_command_topic: /tianbot/wheel_mit_cmd
    diagnostics_topic: /drift_test/diagnostics
    mode_status_topic: /tianbot/motion_mode_status

    # A single launch command activates MIT, waits for readiness/calibration,
    # then starts once after a safety delay. The launch arguments can override
    # the auto_start and activate_mit launch arguments.
    auto_start: true
    activate_mit_on_start: true
    set_control_mode_service: /tianbot/set_control_mode
    mit_activation_timeout_s: 15.0
    auto_start_delay_s: 3.0

    # Refuse to move unless every motor is online in PC_MIT/mit mode.
    require_mit_mode: true

    # Controller order: FL, FR, RL, RR. DYN MIT already normalizes motor directions.
    motor_torque_signs: [1.0, 1.0, 1.0, 1.0]

    # Medium-aggressive profile after wheel-order, sign, and abort checks pass.
    control_rate_hz: 100.0
    direction: 1
    target_radius_m: 0.80
    target_speed_mps: 0.70
    hold_laps: 1.00

    accel_min_time_s: 0.30
    accel_timeout_s: 1.00
    accel_torque_nm: 0.050
    accel_exit_speed_ratio: 0.90
    initiate_duration_s: 0.32
    initiate_base_torque_nm: 0.045
    initiate_diff_torque_nm: 0.025

    hold_base_torque_nm: 0.028
    yaw_rate_kp_nm_per_radps: 0.012
    yaw_rate_ki_nm_per_rad: 0.0035
    yaw_integral_limit_rad: 1.5
    max_yaw_diff_torque_nm: 0.020

    use_odom_speed_feedback: true
    speed_kp_nm_per_mps: 0.012
    max_speed_correction_nm: 0.012

    use_odom_radius_feedback: false
    radius_to_yaw_gain_radps_per_m: 0.35
    radial_velocity_to_yaw_gain_rad_per_m: 0.08
    radius_feedback_delay_s: 3.8
    max_radius_yaw_bias_radps: 0.20
    radius_filter_tau_s: 0.25

    max_wheel_torque_nm: 0.080
    max_torque_slew_nmps: 0.30
    stop_duration_s: 0.60
    sensor_timeout_s: 0.20
    max_abs_yaw_rate_radps: 1.8
    max_speed_mps: 1.2
    gyro_bias_min_samples: 80
    log_directory: ~/.ros/drift_test_logs
