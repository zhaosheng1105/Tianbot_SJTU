drift_4wid_speed_yaw_pid:
  ros__parameters:
    # Tianbot DYN interfaces.
    imu_topic: /tianbot/imu
    odom_topic: /tianbot/odom
    wheel_torque_command_topic: /tianbot/wheel_mit_cmd
    diagnostics_topic: /drift_4wid_speed_yaw_pid/diagnostics
    mode_status_topic: /tianbot/motion_mode_status
    set_control_mode_service: /tianbot/set_control_mode

    # Switch to MIT mode, wait for fresh sensors, count down, then run once.
    auto_start: true
    activate_mit_on_start: true
    require_mit_mode: true
    mit_activation_timeout_s: 15.0
    auto_start_delay_s: 3.0

    # Logical and DYN order: FL, FR, RL, RR.
    motor_torque_signs: [1.0, 1.0, 1.0, 1.0]

    # Confirmed convention: right-handed IMU, CCW positive. The MATLAB
    # equilibrium and initiation pulse in this file were validated for CCW.
    imu_yaw_sign: 1.0
    direction: 1.0

    # MATLAB target and vehicle values used by acceleration feedforward.
    control_rate_hz: 100.0
    target_radius_m: 1.0
    target_speed_mps: 2.0
    target_turns: 5.0
    vehicle_mass_kg: 7.0
    wheel_radius_m: 0.048

    # MATLAB sensor processing: stationary gyro/accelerometer calibration,
    # then first-order signal and derivative filters.
    calibration_time_s: 2.00
    calibration_timeout_s: 3.0
    calibration_min_samples: 20
    imu_filter_tau_s: 0.020
    imu_derivative_tau_s: 0.050
    speed_filter_tau_s: 0.060
    speed_derivative_tau_s: 0.100
    accel_x_sign: 1.0
    accel_y_sign: 1.0

    # Acceleration-based sideslip estimate and beta-to-yaw-reference outer loop.
    beta_desired_deg: -30.0
    beta_kp_radps_per_rad: 1.0
    max_beta_yaw_ref_correction_radps: 0.40
    beta_estimate_min_deg: -70.0
    beta_estimate_max_deg: 30.0
    beta_estimate_min_speed_mps: 0.35

    # Acceleration and open-loop initiation from the MATLAB controller.
    accel_time_s: 0.78
    accel_torque_max_nm: 0.54
    accel_max_yaw_correction_nm: 0.08
    pulse_duration_s: 0.82
    pulse_torque_nm: [-0.128, 0.260, -0.096, 0.248]
    transition_time_s: 0.05

    # mu=0.75 nonlinear equilibrium solved offline in MATLAB. These are four
    # independent values; the ROS node does not solve the tire model online.
    hold_feedforward_nm: [0.0796263991840194, -0.555616494418756,
                          0.614939850009095, 0.575811875532933]
    speed_distribution_weights: [1.0, 1.0, 1.0, 1.0]
    yaw_distribution_vector: [-1.0, 1.0, -1.0, 1.0]

    # Filtered odom-speed PID.
    speed_kp_nm_per_mps: 0.24
    speed_ki_nm_per_m: 0.10
    speed_kd_nm_per_mps2: 0.012
    max_speed_correction_nm: 0.22
    speed_integral_limit_m: 1.2

    # Filtered, bias-corrected IMU yaw-rate PID.
    yaw_kp_nm_per_radps: 0.30
    yaw_ki_nm_per_rad: 0.080
    yaw_kd_nm_per_radps2: 0.025
    max_yaw_correction_nm: 0.30
    yaw_integral_limit_rad: 2.0

    # MATLAB actuator constraints. command_slew limits torque commands; it is
    # not a sensor-data filter.
    stop_time_s: 0.55
    software_torque_max_nm: 0.68
    command_slew_nmps: 4.0

    # Hardware safety checks. Zero max_run_time uses the MATLAB time formula.
    sensor_timeout_s: 0.20
    max_abs_yaw_rate_radps: 5.0
    max_odom_speed_mps: 3.5
    wrong_direction_yaw_threshold_radps: 0.20
    wrong_direction_timeout_s: 0.30
    max_run_time_s: 0.0
    log_directory: ~/.ros/drift_test_logs
